<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Health | CameraAI</title><link rel="stylesheet" href="/static/css/style.css"><style>
.health{max-width:1300px;margin:auto;padding:2rem}.health-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}.health-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.health-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:1rem}.health-card h2{font-size:1rem;margin-bottom:.8rem}.metric{display:flex;justify-content:space-between;padding:.38rem 0;border-bottom:1px solid var(--border-color);color:var(--text-muted)}.metric strong{color:var(--text-main)}.ok{color:#6ee7b7}.bad{color:#fca5a5}.warn{color:#fcd34d}.health-table{width:100%;margin-top:1rem;background:var(--bg-card);border-radius:12px;overflow:hidden}.health-table th,.health-table td{padding:.7rem;text-align:left;border-bottom:1px solid var(--border-color)}.health-table th{color:#bfdbfe}.note{color:var(--text-muted)}@media(max-width:900px){.health{padding:1rem}.health-grid{grid-template-columns:1fr}.health-head{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="health"><div class="health-head"><div><h1>Data Health</h1><p class="note">Đối chiếu chỉ đọc giữa SQLite, PostgreSQL và kho clip NAS.</p></div><div><a class="btn btn-glass" href="/admin/database">Xem SQLite</a> <button class="btn btn-primary" onclick="load(true)">Làm mới</button></div></div><p id="updated" class="note">Đang tải…</p><div id="cards" class="health-grid"></div><table class="health-table"><thead><tr><th>Dữ liệu</th><th>SQLite</th><th>PostgreSQL</th><th>Chênh lệch</th><th>Trạng thái</th></tr></thead><tbody id="comparison"></tbody></table></main>
<script>const fmt=n=>Number(n||0).toLocaleString('vi-VN');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function card(title,rows){return `<section class="health-card"><h2>${title}</h2>${rows.map(([a,b,c])=>`<div class="metric"><span>${esc(a)}</span><strong class="${c||''}">${esc(b)}</strong></div>`).join('')}</section>`}async function load(force=false){const r=await fetch(`/api/admin/data-health${force?'?refresh=1':''}`);const d=await r.json();if(!r.ok){document.body.innerHTML+=`<p class="bad">${esc(d.detail||'Không tải được')}</p>`;return}document.querySelector('#updated').textContent=`Cập nhật: ${d.generated_at}`;document.querySelector('#cards').innerHTML=card('SQLite',[['Events',fmt(d.sqlite.events)],['Clip references',fmt(d.sqlite.clips)],['Clip thiếu',fmt(d.sqlite.missing_clip_references),d.sqlite.missing_clip_references?'bad':'ok'],['Outbox pending',fmt(Object.values(d.sqlite.outbox).reduce((s,x)=>s+x.pending,0)),Object.values(d.sqlite.outbox).some(x=>x.pending)?'warn':'ok']])+card('PostgreSQL',[['Trạng thái',d.postgres.state,d.postgres.state==='available'?'ok':'warn'],['Events',d.postgres.events==null?'-':fmt(d.postgres.events)],['Clips',d.postgres.clips==null?'-':fmt(d.postgres.clips)]])+card('NAS / Clip store',[['Trạng thái',d.nas.state,d.nas.state==='available'?'ok':'bad'],['File MP4',fmt(d.nas.files)],['Dung lượng',(d.nas.size_bytes/1024/1024/1024).toFixed(2)+' GB'],['Đường dẫn',d.nas.path]]);document.querySelector('#comparison').innerHTML=d.comparison.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.sqlite)}</td><td>${x.postgres==null?'-':fmt(x.postgres)}</td><td>${x.difference==null?'-':fmt(x.difference)}</td><td class="${x.state==='match'?'ok':x.state==='mismatch'?'bad':'warn'}">${esc(x.state)}</td></tr>`).join('')}load();setInterval(()=>load(),30000)</script></body></html>
