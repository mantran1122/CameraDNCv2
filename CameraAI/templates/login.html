<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập Hệ thống | Đại học Nam Cần Thơ</title>
    <link rel="icon" type="image/png" href="/static/logo_truong_only.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --md-primary: #4f6f9f;
            --md-primary-hover: #3e5b87;
            --md-on-primary: #ffffff;
            --md-primary-container: #e3edf9;
            --md-on-primary-container: #263c5b;
            --md-secondary-container: #e9eff7;
            --md-on-secondary-container: #344355;
            --md-surface: #f8faff;
            --md-surface-container: #f0f4fa;
            --md-surface-container-high: #e8edf5;
            --md-on-surface: #26313f;
            --md-on-surface-variant: #5f6b7a;
            --md-outline: #8c99aa;
            --md-outline-variant: #cbd5e1;
            --md-error-container: #fee2e2;
            --md-on-error-container: #991b1b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: var(--md-surface);
            font-family: var(--font-family);
            font-synthesis: none;
        }

        body,
        button,
        input,
        select,
        textarea {
            font-family: var(--font-family);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 32px 20px;
            overflow-x: hidden;
            display: grid;
            place-items: center;
            position: relative;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            color: var(--md-on-surface);
            background:
                radial-gradient(circle, rgba(79, 111, 159, .14) 1px, transparent 1.2px) 0 0 / 24px 24px,
                radial-gradient(circle at 12% 16%, rgba(211, 228, 248, .58) 0 7%, transparent 7.2%),
                radial-gradient(circle at 88% 84%, rgba(226, 236, 248, .72) 0 10%, transparent 10.2%),
                linear-gradient(145deg, #f8faff 0%, #fff 48%, #f2f6fb 100%);
        }

        .background-shape {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            filter: blur(.2px);
            opacity: .58;
        }

        .background-shape--one {
            width: 280px;
            height: 190px;
            top: -70px;
            right: -85px;
            border-radius: 42% 58% 62% 38% / 48% 36% 64% 52%;
            background: var(--md-primary-container);
            transform: rotate(12deg);
        }

        .background-shape--two {
            width: 230px;
            height: 230px;
            bottom: -115px;
            left: -70px;
            border-radius: 63% 37% 43% 57% / 42% 61% 39% 58%;
            background: var(--md-secondary-container);
            transform: rotate(-18deg);
        }

        .container {
            width: min(100%, 460px);
            position: relative;
            z-index: 1;
            padding: 38px 36px 28px;
            border: 0;
            border-radius: 36px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(38, 60, 91, .025), 0 12px 36px rgba(38, 60, 91, .055);
            backdrop-filter: blur(18px);
        }

        .brand-mark {
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 28px 28px 28px 12px;
            background: #F8FAFC;
            transform: rotate(-2deg);
        }

        .logo {
            display: block;
            width: auto;
            height: 64px;
            transform: rotate(2deg);
            object-fit: contain;
        }

        .page-title {
            display: block;
            width: 100% !important;
            margin: 12px 0 6px;
            color: var(--md-on-surface);
            font-size: clamp(21px, 5vw, 24px);
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -.02em;
            text-align: center !important;
        }

        .subtitle {
            max-width: 360px;
            margin: 0 auto 24px;
            color: var(--md-on-surface-variant);
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        /* Form Controls */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            text-align: left;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--md-on-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            width: 19px;
            height: 19px;
            color: var(--md-outline);
            pointer-events: none;
            transition: color .2s;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 10px 44px 10px 44px;
            border-radius: 16px;
            border: 1.5px solid var(--md-outline-variant);
            background: #f8fafc;
            font-size: 14.5px;
            color: var(--md-on-surface);
            outline: none;
            transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-size: 13.5px;
        }

        .form-input:focus {
            background: #ffffff;
            border-color: var(--md-primary);
            box-shadow: 0 0 0 3.5px rgba(79, 111, 159, .15);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--md-primary);
        }

        .btn-toggle-eye {
            position: absolute;
            right: 12px;
            background: none;
            border: 0;
            padding: 6px;
            display: grid;
            place-items: center;
            color: var(--md-outline);
            cursor: pointer;
            border-radius: 8px;
            transition: color .15s, background-color .15s;
        }

        .btn-toggle-eye:hover {
            color: var(--md-on-surface);
            background: rgba(0, 0, 0, .04);
        }

        .btn-submit {
            min-height: 50px;
            margin-top: 6px;
            padding: 12px 24px;
            border: 0;
            border-radius: 16px;
            background: var(--md-primary);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 111, 159, .25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color .2s ease, box-shadow .2s ease, transform .15s ease;
        }

        .btn-submit:hover {
            background: var(--md-primary-hover);
            box-shadow: 0 6px 18px rgba(79, 111, 159, .32);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: scale(.98);
        }

        .btn-submit:disabled {
            opacity: .75;
            cursor: not-allowed;
            transform: none !important;
        }

        .error,
        .message {
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13.5px;
            display: none;
            line-height: 1.4;
        }

        .error {
            background: var(--md-error-container);
            color: var(--md-on-error-container);
            border: 1px solid #fecaca;
        }

        .message {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #dbeafe;
        }

        .security-note {
            margin: 22px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: var(--md-outline);
            font-size: 12px;
            text-align: center;
        }

        .security-note svg {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }

        @media (max-width: 560px) {
            body {
                padding: 16px 12px;
                align-items: start;
            }

            .container {
                margin: auto 0;
                padding: 30px 20px 24px;
                border-radius: 28px;
            }

            .brand-mark {
                width: 76px;
                height: 76px;
                border-radius: 24px 24px 24px 10px;
            }

            .logo { height: 56px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="background-shape background-shape--one" aria-hidden="true"></div>
    <div class="background-shape background-shape--two" aria-hidden="true"></div>

    <main class="container">
        <!-- Brand Mark & Logo ĐNC -->
        <div class="brand-mark">
            <img class="logo" src="/static/logo_truong_only.png" alt="ĐNC — Đại học Nam Cần Thơ">
        </div>

        <!-- Tiêu đề trang trung tính, bảo mật -->
        <h3 class="page-title">Đăng nhập Hệ thống</h3>
        <p class="subtitle">Đại học Nam Cần Thơ — Hệ thống Giám sát &amp; Tra cứu Video AI</p>

        <!-- Thông báo (Message & Error) -->
        <div class="message" id="alertMessage"></div>
        <div class="error" id="alertError"></div>

        <!-- FORM 2 Ô INPUT: USERNAME VÀ PASSWORD -->
        <form class="login-form" id="loginForm" onsubmit="submitFormLogin(event)">
            <!-- 1. Tên đăng nhập (Username) -->
            <div class="form-group">
                <label class="form-label" for="inputUsername">Tên đăng nhập (Username):</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input 
                        type="text" 
                        id="inputUsername" 
                        class="form-input" 
                        placeholder="Nhập tên đăng nhập..." 
                        autocomplete="username" 
                        required
                    >
                </div>
            </div>

            <!-- 2. Mật khẩu (Password) -->
            <div class="form-group">
                <label class="form-label" for="inputPassword">Mật khẩu (Password):</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input 
                        type="password" 
                        id="inputPassword" 
                        class="form-input" 
                        placeholder="Nhập mật khẩu..." 
                        autocomplete="current-password" 
                        required
                    >
                    <button type="button" class="btn-toggle-eye" id="btnToggleEye" onclick="togglePasswordVisibility()" aria-label="Hiện/ẩn mật khẩu">
                        <svg id="eyeIconOpen" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="eyeIconClosed" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Nút Đăng nhập -->
            <button type="submit" class="btn-submit" id="btnSubmit">
                <span id="btnSubmitIcon">🔓</span>
                <span id="btnSubmitText">Đăng nhập</span>
            </button>
        </form>

        <!-- Security Note Footer -->
        <p class="security-note">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 5 6v5c0 4.6 3 8.6 7 10 4-1.4 7-5.4 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="m9.2 12 1.8 1.8 3.8-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Phiên đăng nhập bảo mật bởi DNC AI Camera
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userInput = document.getElementById('inputUsername');
            if (userInput) userInput.focus();
        });

        function showMessage(msg, isError = false) {
            const el = document.getElementById(isError ? 'alertError' : 'alertMessage');
            const otherEl = document.getElementById(isError ? 'alertMessage' : 'alertError');
            otherEl.style.display = 'none';
            el.textContent = msg;
            el.style.display = 'block';
            if (!isError) {
                setTimeout(() => { el.style.display = 'none'; }, 3000);
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('inputPassword');
            const eyeOpen = document.getElementById('eyeIconOpen');
            const eyeClosed = document.getElementById('eyeIconClosed');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                passInput.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        async function submitFormLogin(e) {
            if (e) e.preventDefault();
            const user = (document.getElementById('inputUsername')?.value || '').trim();
            const pass = (document.getElementById('inputPassword')?.value || '').trim();
            const submitBtn = document.getElementById('btnSubmit');
            const submitText = document.getElementById('btnSubmitText');
            const submitIcon = document.getElementById('btnSubmitIcon');

            if (!user || !pass) {
                showMessage('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.', true);
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitText.textContent = 'Đang xác thực...';
                submitIcon.textContent = '⏳';
            }

            try {
                const resp = await fetch('/api/admin/verify-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (false && resp.status === 404) {
                    // Fallback tương thích
                    const isMatchAdmin = (user === 'admin' && (pass === 'namcantho@168' || pass === 'admin'));
                    if (isMatchAdmin) {
                        onAuthSuccess(user, 'admin', true);
                        return;
                    } else if (pass) {
                        // Tài khoản con thường
                        onAuthSuccess(user, 'viewer', false);
                        return;
                    }
                }

                const res = await resp.json();
                if (resp.ok) {
                    onAuthSuccess(user, res.role, res.can_config_nvr);
                } else {
                    showMessage(res.detail || 'Sai tên đăng nhập hoặc mật khẩu.', true);
                    const passInput = document.getElementById('inputPassword');
                    if (passInput) {
                        passInput.select();
                        passInput.focus();
                    }
                }
            } catch (err) {
                if (false && user === 'admin' && (pass === 'namcantho@168' || pass === 'admin')) {
                    onAuthSuccess(user, 'admin', true);
                    return;
                }
                showMessage('Lỗi kết nối máy chủ: ' + err.message, true);
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitText.textContent = 'Đăng nhập';
                    submitIcon.textContent = '🔓';
                }
            }
        }

        function onAuthSuccess(user, role, can_config_nvr) {
            sessionStorage.setItem('dnc_user_logged_in', 'true');
            sessionStorage.setItem('ncc_config_user', user);
            sessionStorage.setItem('ncc_user_role', role || (can_config_nvr ? 'admin' : 'viewer'));

            if (can_config_nvr) {
                // Chỉ tài khoản admin mới được cấp quyền Cấu hình NVR
                sessionStorage.setItem('ncc_config_auth', 'true');
                sessionStorage.removeItem('ncc_auto_open_config');
                showMessage('Xác thực Quản trị viên thành công! Đang vào hệ thống...', false);
            } else {
                // Tài khoản khác: Ẩn hoàn toàn cấu hình NVR, chỉ vào xem camera
                sessionStorage.removeItem('ncc_config_auth');
                sessionStorage.removeItem('ncc_auto_open_config');
                showMessage('Đăng nhập thành công! Đang chuyển đến màn hình giám sát...', false);
            }

            setTimeout(() => {
                window.location.href = '/search';
            }, 400);
        }

        // Phím tắt bí mật: Ctrl + Shift + C
        window.addEventListener('keydown', function(e) {
            if (false && e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C' || e.keyCode === 67)) {
                e.preventDefault();
                const userInput = document.getElementById('inputUsername');
                const passInput = document.getElementById('inputPassword');
                if (userInput) userInput.value = 'admin';
                if (passInput) passInput.value = 'namcantho@168';
                submitFormLogin();
                return;
            }

            if (e.key === 'Escape') {
                const err = document.getElementById('alertError');
                if (err) err.style.display = 'none';
                const passInput = document.getElementById('inputPassword');
                if (passInput) {
                    passInput.value = '';
                    passInput.focus();
                }
            }
        });
    </script>
</body>

</html>
