<div class="timeline-item $active $validation_class" onclick="javascript:window.parent.postMessage({type:'timeline_select',index:$index}, '*')">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span class="timeline-time">$validation_icon #$number · $start → $end</span><span class="timeline-risk risk-$risk">$risk_label</span></div>
  <p class="timeline-desc">$description</p><div style="margin-top:4px;">$badges</div>
</div>
